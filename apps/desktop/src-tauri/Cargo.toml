[package]
name = "memory-regainer-desktop"
version = "0.1.2"
description = "Offline read-only file recovery"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Memory Regainer contributors"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.16"
sha2 = "0.10"
base64 = "0.22"
recovery-core = { path = "../../../crates/recovery-core" }
